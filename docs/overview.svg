<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430"><title>JM 洁净版功能概览</title><rect width="960" height="430" rx="20" fill="#102825"/><g font-family="system-ui, sans-serif"><text x="36" y="62" fill="#f1fcf5" font-size="34" font-weight="700">JM 洁净版</text><text x="745" y="58" fill="#99dbc4" font-size="21">0.1-rc21 · ARM64</text><g transform="translate(36 90)"><rect width="438" height="143" rx="12" fill="#193d37"/><text x="21" y="32" fill="#9cdec7" font-size="16">阅读器</text><text x="21" y="73" fill="#ffffff" font-size="25" font-weight="600">五种阅读方式</text><text x="21" y="111" fill="#d0e6dd" font-size="17">条漫、左右单页与双页</text></g><g transform="translate(486 90)"><rect width="438" height="143" rx="12" fill="#193d37"/><text x="21" y="32" fill="#9cdec7" font-size="16">线路</text><text x="21" y="73" fill="#ffffff" font-size="25" font-weight="600">最多尝试三条线路</text><text x="21" y="111" fill="#d0e6dd" font-size="17">详情、搜索遇到临时故障可重试</text></g><g transform="translate(36 250)"><rect width="438" height="143" rx="12" fill="#193d37"/><text x="21" y="32" fill="#9cdec7" font-size="16">离线</text><text x="21" y="73" fill="#ffffff" font-size="25" font-weight="600">从 ZIP 按页读取</text><text x="21" y="111" fill="#d0e6dd" font-size="17">本地书架可断网打开</text></g><g transform="translate(486 250)"><rect width="438" height="143" rx="12" fill="#193d37"/><text x="21" y="32" fill="#9cdec7" font-size="16">评论</text><text x="21" y="73" fill="#ffffff" font-size="25" font-weight="600">规则与样本留在本机</text><text x="21" y="111" fill="#d0e6dd" font-size="17">手动屏蔽、账号黑名单与备份</text></g></g></svg>